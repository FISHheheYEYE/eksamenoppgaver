<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <title>Meldinger</title>
    <link rel="stylesheet" href="/css/melding.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Meldinger</h1>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- PROFIL KORT -->
        <section class="melding-card">
            <gruppe> </gruppe>, <melding> Hei, vil du være med på gaming i kveld? </melding>
        </section>

        <!-- BOTTOM SECTION -->
        <div class="bottom-section">
            <!-- GRUPPER -->
            <section class="groups">
                <h3>Dine grupper</h3>
                <button class="group-btn">🎮 Gaming Squad</button>
                <button class="group-btn">🎵 Musikk klubb</button>

                <h3>Finn nye grupper</h3>
                <button class="group-btn">♟️ Brettspill kveld</button>
                <button class="group-btn">🌍 Språk gruppe</button>

                <button class="create-btn">+ Lag ny gruppe</button>
            </section>

        </div>

    </main>

    <!-- BUNN MENY -->
    <nav class="bottom-nav">
        <a href="/hjem" class="nav-item">🏠<p>Hjem</p></a>
        <a href="/melding" class="nav-item">💬<p>Meldinger</p></a>
        <a href="/profil" class="nav-item">👤<p>Profil</p></a>
    </nav>

    <script>
        let isEditMode = false;

        // Load and restore saved interests when page loads
        document.addEventListener('DOMContentLoaded', function () {
            console.log('⏳ Profile page loading...');

            // First, restore saved interests from localStorage
            restoreSavedInterests();

            // Setup all event listeners
            setupCheckboxListeners();
            setupEditButton();
            setupBioButtons();

            console.log('✅ Profile page ready');
        });

        function restoreSavedInterests() {
            console.log('📂 Restoring saved interests from localStorage...');
            const savedInterests = localStorage.getItem('userInterests');

            if (savedInterests) {
                try {
                    const interests = JSON.parse(savedInterests);
                    console.log('📋 Found saved interests:', interests);

                    // Uncheck all first
                    document.querySelectorAll('.interests-list input[type="checkbox"]').forEach(cb => {
                        cb.checked = false;
                    });

                    // Then check only the saved ones
                    interests.forEach(interest => {
                        const checkbox = document.querySelector(`.interests-list input[value="${interest}"]`);
                        if (checkbox) {
                            checkbox.checked = true;
                            console.log('✅ Checked:', interest);
                        } else {
                            console.log('⚠️ Checkbox not found for:', interest);
                        }
                    });

                    // Update display
                    updateInterestsDisplay();
                } catch (e) {
                    console.error('❌ Error restoring interests:', e);
                }
            } else {
                console.log('ℹ️ No saved interests, using defaults');
                updateInterestsDisplay();
            }
        }

        function setupCheckboxListeners() {
            const checkboxes = document.querySelectorAll('.interests-list input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', function () {
                    console.log('📍 Checkbox changed:', this.value, '→', this.checked);
                    updateInterestsDisplay();
                });
            });
        }

        function setupEditButton() {
            document.getElementById('edit-mode-btn').addEventListener('click', function () {
                isEditMode = !isEditMode;
                const editOnlyElements = document.querySelectorAll('.edit-only');
                editOnlyElements.forEach(el => {
                    el.style.display = isEditMode ? 'block' : 'none';
                });

                if (isEditMode) {
                    this.textContent = 'Done';
                } else {
                    this.textContent = 'Edit';
                    // When Done is clicked, save the interests
                    saveInterests();
                }
            });
        }

        function saveInterests() {
            console.log('💾 SAVING HOBBIES...');
            const checked = document.querySelectorAll('.interests-list input[type="checkbox"]:checked');
            const selected = Array.from(checked).map(cb => cb.value);

            console.log('Hobbies selected:', selected);

            // Save to localStorage
            localStorage.setItem('userInterests', JSON.stringify(selected));
            console.log('✅ HOBBIES SAVED TO STORAGE!');

            // Notify messaging app
            window.dispatchEvent(new Event('userInterestsChanged'));
            console.log('📤 Event sent to messaging app');
        }

        function updateInterestsDisplay() {
            const checked = document.querySelectorAll('.interests-list input[type="checkbox"]:checked');
            const selected = Array.from(checked).map(cb => cb.value);
            const interestsDisplay = document.querySelector('.interests');
            interestsDisplay.textContent = selected.join(' • ');
        }

        function setupBioButtons() {
            document.getElementById('edit-bio-btn').addEventListener('click', function () {
                const bioText = document.getElementById('bio-text');
                const bioEdit = document.getElementById('bio-edit');
                const editBtn = document.getElementById('edit-bio-btn');
                const saveBtn = document.getElementById('save-bio-btn');

                bioEdit.value = bioText.textContent;
                bioText.style.display = 'none';
                bioEdit.style.display = 'block';
                editBtn.style.display = 'none';
                saveBtn.style.display = 'inline-block';
            });

            document.getElementById('save-bio-btn').addEventListener('click', function () {
                const bioText = document.getElementById('bio-text');
                const bioEdit = document.getElementById('bio-edit');
                const editBtn = document.getElementById('edit-bio-btn');
                const saveBtn = document.getElementById('save-bio-btn');

                bioText.textContent = bioEdit.value;
                bioText.style.display = 'block';
                bioEdit.style.display = 'none';
                editBtn.style.display = 'inline-block';
                saveBtn.style.display = 'none';

                console.log('Bio oppdatert:', bioText.textContent);
            });
        }
    </script>

</body>

</html>
